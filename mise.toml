[tools]
bun = "1.4"
# main.js builds the upstream checkout with Maven and Java 8, matching the sync workflow.
java = "zulu-8"
maven = "3.9"
# Installs the Git hook on every `mise install` and avoids running the global prek hook twice.
prek = { version = "latest", postinstall = { run = "prek install && git config hook.prek.enabled false", when = "always" } }
