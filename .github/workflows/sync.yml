---
on:
  schedule:
    - cron: 0 0 * * 5
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7 # zizmor: ignore[artipacked] main.js pushes the new tags
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout upstream repository
        uses: actions/checkout@v7
        with:
          repository: moysklad/java-remap-1.2-sdk
          path: upstream
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Sync and publish new tags
        run: bun main.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
